name: Build Extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write CRX signing key
        run: |
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            echo "$CRX_PRIVATE_KEY" | base64 -d > key.pem
            echo "CRX key written."
          else
            echo "Secret CRX_PRIVATE_KEY not set – CRX build will be skipped."
          fi
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Build
        run: npm run build

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: production/extension.zip

      - name: Upload CRX
        if: hashFiles('production/extension.crx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: extension-crx
          path: production/extension.crx
